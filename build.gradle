plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = "${mod_version}"
group = "${package_group}"
archivesBaseName = "${mod_id}-${mc_version}"

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // deobf依存(curios等)の mixin refmap を SRG→official に remap。
            // 無いと curios.mixins.json の @Accessor が f_19803_ を解決できず dev でクラッシュする。
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenCentral()                                                             // 推移依存(SLF4J/commons/cobalt等)
    maven { url 'https://maven.minecraftforge.net/' }                          // Forge maven
    maven { url 'https://maven.blamejared.com' }                               // Ars Nouveau 公式 maven
    maven { url 'https://squiddev.cc/maven/'; content { includeGroup 'cc.tweaked' } }   // CC:Tweaked
    maven {                                                                    // GeckoLib
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroupByRegex 'software\\.bernie.*' }
    }
    maven { url 'https://maven.theillusivec4.top/' }                           // Curios 公式
    maven { url 'https://modmaven.dev' }                                       // 退避路
}

dependencies {
    minecraft "net.minecraftforge:forge:${mc_version}-${forge_version}"

    // Ars Nouveau(継承元・compile依存)。BlameJared 公式座標。fg.deobf が SRG→official remap。
    implementation fg.deobf("com.hollingsworth.ars_nouveau:ars_nouveau-${mc_version}:${ars_version}")

    // GeckoLib(継承元 BasicSpellTurretTile が GeoBlockEntity を implements する為 compile必須)。ATM同梱版に一致。
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${mc_version}:${gecko_version}")

    // CC:Tweaked(peripheral実装)。dev maven の最新は 1.111.0(実機の1.116.1とAPI互換)。
    compileOnly         "cc.tweaked:cc-tweaked-${mc_version}-core-api:${cct_version}"
    compileOnly fg.deobf("cc.tweaked:cc-tweaked-${mc_version}-forge-api:${cct_version}")
    runtimeOnly fg.deobf("cc.tweaked:cc-tweaked-${mc_version}-forge:${cct_version}")

    // Ars Nouveau の実行時 mandatory 依存。compileJava には不要だが、runClient で Ars を実ロードすると
    // Ars 自身が要求する。これが無いと起動時にロード拒否(curios)/mixinクラッシュ(MixinExtras)になる。
    // - Curios: Ars が mandatory 依存(範囲 [1.19-5.0.7.1,))。MOD jar なので fg.deobf 要。
    runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")
    // - MixinExtras: Ars の mixin が要求。fg.deobf だと Ars jar 内の jarjar 版が展開されない為、明示追加。
    //   ライブラリ(非MOD jar)なので fg.deobf 不要。後方互換ありで新しめを使う。
    runtimeOnly "io.github.llamalad7:mixinextras-forge:${mixin_extras_version}"
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : "${mod_id}",
            'Specification-Vendor'    : "${mod_id}",
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : "${mod_id}",
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
