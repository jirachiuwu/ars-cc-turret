plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = "${mod_version}"
group = "${package_group}"
archivesBaseName = "${mod_id}-${mc_version}"

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenCentral()                                                             // 推移依存(SLF4J/commons/cobalt等)
    maven { url 'https://maven.minecraftforge.net/' }                          // Forge maven
    maven { url 'https://maven.blamejared.com' }                               // Ars Nouveau 公式 maven
    maven { url 'https://squiddev.cc/maven/'; content { includeGroup 'cc.tweaked' } }   // CC:Tweaked
    maven {                                                                    // GeckoLib
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroupByRegex 'software\\.bernie.*' }
    }
    maven { url 'https://modmaven.dev' }                                       // 退避路
}

dependencies {
    minecraft "net.minecraftforge:forge:${mc_version}-${forge_version}"

    // Ars Nouveau(継承元・compile依存)。BlameJared 公式座標。fg.deobf が SRG→official remap。
    implementation fg.deobf("com.hollingsworth.ars_nouveau:ars_nouveau-${mc_version}:${ars_version}")

    // GeckoLib(継承元 BasicSpellTurretTile が GeoBlockEntity を implements する為 compile必須)。ATM同梱版に一致。
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${mc_version}:${gecko_version}")

    // CC:Tweaked(peripheral実装)。dev maven の最新は 1.111.0(実機の1.116.1とAPI互換)。
    compileOnly         "cc.tweaked:cc-tweaked-${mc_version}-core-api:${cct_version}"
    compileOnly fg.deobf("cc.tweaked:cc-tweaked-${mc_version}-forge-api:${cct_version}")
    runtimeOnly fg.deobf("cc.tweaked:cc-tweaked-${mc_version}-forge:${cct_version}")
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : "${mod_id}",
            'Specification-Vendor'    : "${mod_id}",
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : "${mod_id}",
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
